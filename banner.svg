<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="300" viewBox="0 0 1000 300">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a16"/>
      <stop offset="55%" style="stop-color:#151a3a"/>
      <stop offset="100%" style="stop-color:#0a0a16"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#7f5af0"/>
      <stop offset="100%" style="stop-color:#2cb67d"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="300" fill="url(#bg)"/>

  <!-- starfield -->
  <g fill="#ffffff">
    <circle cx="60" cy="40" r="1.2" opacity="0.7"/>
    <circle cx="150" cy="90" r="1" opacity="0.5"/>
    <circle cx="240" cy="30" r="1.4" opacity="0.8"/>
    <circle cx="330" cy="110" r="0.9" opacity="0.4"/>
    <circle cx="420" cy="50" r="1.1" opacity="0.6"/>
    <circle cx="520" cy="80" r="1.3" opacity="0.7"/>
    <circle cx="610" cy="40" r="0.9" opacity="0.5"/>
    <circle cx="700" cy="100" r="1.2" opacity="0.7"/>
    <circle cx="790" cy="35" r="1" opacity="0.5"/>
    <circle cx="880" cy="90" r="1.4" opacity="0.8"/>
    <circle cx="950" cy="55" r="0.9" opacity="0.5"/>
    <circle cx="100" cy="180" r="1.1" opacity="0.5"/>
    <circle cx="300" cy="200" r="0.9" opacity="0.4"/>
    <circle cx="500" cy="220" r="1.2" opacity="0.6"/>
    <circle cx="700" cy="200" r="1" opacity="0.5"/>
    <circle cx="900" cy="210" r="1.3" opacity="0.7"/>
  </g>

  <!-- name / title -->
  <text x="500" y="130" font-family="monospace" font-size="46" font-weight="bold"
        text-anchor="middle" fill="url(#accent)" letter-spacing="2">ASTRAL
    <tspan fill="#e6e6f0">ZX</tspan>
  </text>

  <line x1="250" y1="155" x2="750" y2="155" stroke="url(#accent)" stroke-width="2" opacity="0.6"/>

  <text x="500" y="185" font-family="monospace" font-size="18" letter-spacing="6"
        text-anchor="middle" fill="#a9a9c0">SYSTEMS&nbsp;&amp;&nbsp;SOURCE</text>

  <text x="500" y="235" font-family="monospace" font-size="13" letter-spacing="1"
        text-anchor="middle" fill="#6f6f8a">linux · wayland · rust · c++ · shell</text>
</svg>
